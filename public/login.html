<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devlens — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-bg: #0d0d0f;
      --color-surface: #16181c;
      --color-surface-2: #1e2026;
      --color-border: #2a2d35;
      --color-text: #e8eaed;
      --color-text-secondary: #9aa0ad;
      --color-primary: #6366f1;
      --color-primary-hover: #818cf8;
      --color-danger: #f87171;
      --radius-md: 8px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-name { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-sub { font-size: 12px; color: var(--color-text-secondary); }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
    }
    input:focus { border-color: var(--color-primary); }
    button {
      width: 100%;
      padding: 11px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    button:hover { background: var(--color-primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      color: var(--color-danger);
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
    }
    .hint {
      font-size: 12px;
      color: var(--color-text-secondary);
      text-align: center;
      margin-top: 20px;
    }
    code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--color-surface-2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Devlens</div>
        <div class="brand-sub">Claude Code Dashboard</div>
      </div>
    </div>

    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="admin" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>

      <button type="submit" id="login-btn">Sign in</button>
      <div class="error" id="error-msg"></div>
    </form>

    <p class="hint">Default: <code>admin</code> / <code>devlens</code></p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('error-msg');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          const redirect = new URLSearchParams(location.search).get('redirect') || '/';
          location.href = redirect;
        } else {
          errorEl.textContent = data.error || 'Login failed';
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      } catch {
        errorEl.textContent = 'Connection error';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    // Focus password if username is already filled
    if (document.getElementById('username').value) {
      document.getElementById('password').focus();
    }
  </script>
</body>
</html>
